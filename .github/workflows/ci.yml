name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Type-check all targets
        run: moon check --target all --no-mbti --deny-warn

      - name: Run tests
        run: moon test

      - name: Run native tests
        run: moon test --target native

      - name: Run deterministic data-set evaluation
        run: |
          moon run --target native cmd/eval -- datasets/contracts.json datasets/support-tickets.json > /tmp/moonextract-eval.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/moonextract-eval.json").read_text(encoding="utf-8"))
          for scenario in result:
              engine = scenario["summary"]["engine"]
              assert engine["value_accuracy"] == 1.0, scenario
              assert engine["evidence_accuracy"] == 1.0, scenario
              assert engine["false_positives"] == 0, scenario
              assert engine["false_negatives"] == 0, scenario
              assert engine["diagnostics_unexpected"] == 0, scenario
          print("evaluation: field, evidence, and diagnostic checks passed")
          PY

      - name: Verify OpenAI-compatible transport
        env:
          MOONEXTRACT_API_KEY: test-key
          MOONEXTRACT_BASE_URL: http://127.0.0.1:18765/v1
          MOONEXTRACT_MODEL: moonextract-mock
        run: |
          python scripts/mock_openai_server.py --port 18765 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          moon run --target native cmd/extract -- examples/contract-fields.json examples/contract.txt > /tmp/moonextract-contract.json
          moon run --target native cmd/extract -- examples/ticket-fields.json examples/ticket.txt > /tmp/moonextract-ticket.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("contract", "ticket"):
              result = json.loads(Path(f"/tmp/moonextract-{name}.json").read_text(encoding="utf-8"))
              assert result["diagnostics"] == [], result
              assert result["fields"], result
          print("openai-compatible transport: contract and ticket extraction passed")
          PY
